<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | Boisar Public School</title>
  <link rel="stylesheet" href="gallery/gallery.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta property="og:title" content="Boisar Public School">
    <meta property="og:description" content="Welcome to Boisar Public School. Discover our mission, core values, and educational goals.">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <meta property="og:image" href="assets/images/vision.jpg">

</head>
<body>
  <div id="video-overlay">
<video autoplay muted loop playsinline id="background-video" poster="assets/fallback.jpeg">
<source src="assets/background_vid.mp4" type="video/mp4">
Your browser does not support the video tag.
</video>
</div>
  <!-- NAVBAR -->

  <nav id="main-navbar">
    <div class="brand">
      <img src="assets/logo.png" alt="BPS" height="40px" width="40px">
    </div>
    <ul class="nav-links">
      <li><a href="/bps">HOME</a></li>
      <li><a href="academics.html">ACADEMICS</a></li>
      <li><a class="active">GALLERY</a></li>
      <li><a href="contact.html">CONTACT US</a></li>
      <li><a href="about.html">ABOUT US</a></li>
    </ul>
    <button class="hamburger">&#9776;</button>
  </nav>

  <!-- GALLERY FILTER -->
  <section class="gallery-filter scroll-animate">
    <h2 class="floating">Gallery</h2>
    <select id="event-filter" title="Filter">
      <option value="all">All Events</option>
      <option value="annual">Annual Day</option>
      <option value="sports">Sports</option>
      <option value="science">Science Fair</option>
    </select>
  </section>

  <!-- GALLERY GRID -->
  <section class="gallery-section scroll-animate">
    <div class="gallery-grid" id="gallery-grid">
      <img src="../assets/images/gallery1.jpg" alt="Annual Day" data-event="annual">
      <img src="../assets/images/gallery2.jpg" alt="Sports" data-event="sports">
      <img src="../assets/images/gallery3.jpg" alt="Science Fair" data-event="science">
      <img src="../assets/images/gallery4.jpg" alt="Annual Day" data-event="annual">
      <img src="../assets/images/gallery5.jpg" alt="Sports" data-event="sports">
      <img src="../assets/images/gallery6.jpg" alt="Science Fair" data-event="science">
      <!-- Add more dummy images as needed -->
    </div>
  </section>

  <!-- IMAGE MODAL -->
  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-img" alt="">
    <div id="modal-caption"></div>
  </div>

  <!-- FOOTER -->
  <footer id="site-footer">
    <ul>
      <li><a href="academics.html">Academics</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
    <p>© 2025 Boisar Public School. All rights reserved.</p>
  </footer>

  <script src="gallery/gallery.js"></script>
</body>
</html>
